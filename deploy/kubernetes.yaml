apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-api-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: ai-api-platform}}
 template:
  metadata: {labels: {app: ai-api-platform}}
  spec:
   securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
     type: RuntimeDefault
   containers:
   - name: api
     image: ai-api-platform:0.1.0
     imagePullPolicy: IfNotPresent
     ports: [{containerPort: 8000}]
     securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
       drop: [ALL]
      seccompProfile:
       type: RuntimeDefault
     resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
     readinessProbe:
      httpGet: {path: /health/ready, port: 8000}
      initialDelaySeconds: 5
      periodSeconds: 10
     livenessProbe:
      httpGet: {path: /health/live, port: 8000}
      initialDelaySeconds: 10
      periodSeconds: 20
