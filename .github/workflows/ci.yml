name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: "pip"}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --ignore-missing-imports .
      - name: Tests
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70
      - name: Container build
        run: docker build -t ai-api-platform:ci .
      - name: Deployment manifest verification
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          manifests = [
              Path("deploy/kubernetes.yaml"),
              Path("deploy/helm/values.yaml"),
          ]
          for path in manifests:
              yaml.safe_load(path.read_text())
              text = path.read_text()
              assert "tag: latest" not in text, f"{path} still uses latest"
              assert "imagePullPolicy: IfNotPresent" in text or path.name == "values.yaml"
          print("deployment manifests parsed and immutable default image tags verified")
          PY
